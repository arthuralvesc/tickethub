spring:
  application:
    name: tickethub
  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub_db
    username: ${POSTGRES_USER:tickethub}
    password: ${POSTGRES_PASSWORD:tickethub123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    jwt:
      secret: ${JWT_SECRET:mysecretkey123456789012345678901234567890123456789012345678901234567890}
      expiration: 3600000

